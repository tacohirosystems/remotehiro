[workspace]
resolver = "2"
members = ["crates/*"]

[profile.release]
lto = true
codegen-units = 1

[profile.dev.package.backtrace]
opt-level = 3

[workspace.package]
edition = "2024"
homepage = "https://www.remotehiro.com"
include = ["**/*.rs", "Cargo.toml", "crates/**/*.sql", "templates/**/*.html"]
repository = "https://github.com/tacohirosystems/remotehiro"
rust-version = "1.99"
version = "0.0.1-alpha"
license = "EUPL-1.2"

[workspace.dependencies]
bin = { path = "crates/bin" }
server = { path = "crates/server" }
model = { path = "crates/model" }
category = { path = "crates/category" }
job = { path = "crates/job" }
location = { path = "crates/location" }
tag = { path = "crates/tag" }
employment = { path = "crates/employment" }
company = { path = "crates/company" }
libhtmx = { path = "crates/libhtmx" }
database = { path = "crates/database" }
warehouse = { path = "crates/warehouse" }

# Database
rusqlite = { version = "0.40", features = [
  "serde_json",
  "array",
  "buildtime_bindgen",
  "time",
  "functions",
] }
su_sqlite = { git = "https://github.com/sekunho/pkg.git", branch = "main" }
deadpool-sqlite = { version = "0.14" }

# Web
axum = { version = "0.8", features = ["multipart", "macros", "json"] }
axum-extra = { version = "0.12", features = [
  "query",
  "form",
  "cookie",
  "typed-header",
] }
http = { version = "1.3" }
headers = { version = "0.4" }
slug = { version = "0.1" }
tower-http = { version = "0.6", features = ["fs", "compression-br", "trace"] }
tower = { version = "0.5" }
url = { version = "2.5", features = ["serde"] }

# Templating
ammonia = { version = "4.0" }
minijinja = { version = "3.0", default-features = false, features = [
  "macros",
  "multi_template",
  "builtins",
  "json",
  "serde",
] }
minijinja-contrib = { version = "3.0", features = ["datetime"] }
pulldown-cmark = { version = "0.13" }
su_template = { git = "https://github.com/sekunho/pkg.git", branch = "main" }

# Serialization
serde = { version = "1.0" }
serde_html_form = "0.4"
serde_json = { version = "1.0" }

# Image
resvg = "0.48.0"

# Async
tokio = { version = "1.44", features = ["net", "rt-multi-thread", "signal"] }

time = { version = "0.3", features = ["serde-human-readable", "formatting"] }
rust_decimal = { version = "1.40", features = [] }

# Logging
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

rss = { version = "2.1", features = [ "atom", "with-serde" ] }
quick-xml = { version = "0.41" }

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
dbg_macro = "deny"
